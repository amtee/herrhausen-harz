name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'

concurrency:
  group: deploy
  cancel-in-progress: true

defaults:
  run:
    working-directory: site

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - run: npm run build

      - name: SSH-Key einrichten
        env:
          SSH_PRIVATE_KEY_BASE_64: ${{ secrets.SSH_PRIVATE_KEY_BASE_64 }}
          HOST: ${{ secrets.HOST }}
          PORT: ${{ secrets.PORT }}
        run: |
          for v in SSH_PRIVATE_KEY_BASE_64 HOST PORT; do
            [ -n "${!v}" ] || { echo "::error::$v ist nicht gesetzt"; exit 1; }
          done
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY_BASE_64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # Der Pfad muss /home/<user>/<slug>/site sein; rsync --delete darf nie im geteilten Home-Verzeichnis laufen.
      - name: Zielpfad prüfen
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          [ -n "$DEPLOY_PATH" ] || { echo "::error::DEPLOY_PATH ist nicht gesetzt"; exit 1; }
          case "$DEPLOY_PATH" in
            *..*|*[[:space:]]*) echo "::error::DEPLOY_PATH enthält ungültige Zeichen"; exit 1 ;;
          esac
          [[ "$DEPLOY_PATH" =~ ^/home/[^/]+/[^/]+/site$ ]] || { echo "::error::DEPLOY_PATH muss /home/<user>/<slug>/site sein, ist aber: $DEPLOY_PATH"; exit 1; }

      - name: Dateien auf den Webserver kopieren
        env:
          HOST: ${{ secrets.HOST }}
          PORT: ${{ secrets.PORT }}
          USER: ${{ secrets.USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          rsync -rlptDvz --delete --update \
            -e "ssh -i ~/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=yes" \
            dist/ "$USER@$HOST:$DEPLOY_PATH/"

      - name: Aufräumen
        if: always()
        run: rm -f ~/.ssh/deploy_key