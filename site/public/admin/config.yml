backend:
  name: github
  repo: amtee/herrhausen-harz
  branch: main
  base_url: https://auth.tams.one
  auth_endpoint: auth.php

media_folder: site/public/images
public_folder: /images
locale: de

collections:
  - name: pages
    label: Seiten
    folder: site/src/content/pages
    create: true
    format: frontmatter
    fields:
      - { name: title, label: Titel, widget: string }
      - { name: path, label: Pfad, widget: string, hint: Beginnt und endet mit einem Schrägstrich. }
      - { name: summary, label: Kurzbeschreibung, widget: text }
      - { name: navLabel, label: Navigationsname, widget: string, required: false }
      - { name: order, label: Reihenfolge, widget: number, default: 99 }
      - { name: showInNav, label: In Hauptnavigation anzeigen, widget: boolean, default: false }
      - { name: body, label: Text, widget: markdown }
  - name: news
    label: Aktuelles
    folder: site/src/content/news
    create: true
    format: frontmatter
    fields:
      - { name: title, label: Titel, widget: string }
      - { name: date, label: Datum, widget: date, format: YYYY-MM-DD }
      - { name: summary, label: Kurzfassung, widget: text }
      - { name: draft, label: Entwurf, widget: boolean, default: false, required: false }
      - { name: body, label: Text, widget: markdown }
  - name: events
    label: Veranstaltungen
    folder: site/src/content/events
    create: true
    format: frontmatter
    fields:
      - { name: title, label: Titel, widget: string }
      - { name: date, label: Datum, widget: date, format: YYYY-MM-DD }
      - { name: location, label: Ort, widget: string, required: false }
      - { name: summary, label: Kurzfassung, widget: text }
      - { name: draft, label: Entwurf, widget: boolean, default: false, required: false }
      - { name: body, label: Text, widget: markdown }
  - name: documents
    label: Dokumente
    folder: site/src/content/documents
    create: true
    format: frontmatter
    fields:
      - { name: title, label: Titel, widget: string }
      - { name: file, label: Datei, widget: string, hint: Pfad unter public/ oder vollständige externe URL. }
      - { name: category, label: Kategorie, widget: select, options: [{ label: Ortsrat, value: ortsrat }, { label: Satzung, value: satzung }, { label: Sonstiges, value: sonstiges }] }
      - { name: date, label: Datum, widget: date, required: false, format: YYYY-MM-DD }
      - { name: available, label: Datei verfügbar, widget: boolean, default: true }
      - { name: body, label: Beschreibung, widget: markdown, required: false }
  - name: organisations
    label: Vereine und Einrichtungen
    folder: site/src/content/organisations
    create: true
    format: frontmatter
    fields:
      - { name: title, label: Name, widget: string }
      - { name: kind, label: Art, widget: select, options: [{ label: Verein, value: verein }, { label: Einrichtung, value: einrichtung }, { label: Gruppe, value: gruppe }] }
      - { name: summary, label: Kurzbeschreibung, widget: text }
      - { name: contact, label: Kontakt, widget: string, required: false }
      - { name: website, label: Website, widget: string, required: false }
      - { name: order, label: Reihenfolge, widget: number, default: 99 }
      - { name: draft, label: Entwurf, widget: boolean, default: false }
      - { name: body, label: Beschreibung, widget: markdown, required: false }